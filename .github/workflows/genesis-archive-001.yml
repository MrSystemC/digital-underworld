name: GENESIS ARCHIVE #001 checks

on:
  push:
    branches: [main, genesis-archive-001]
    paths:
      - "genesis-archive-001/**"
  pull_request:
    paths:
      - "genesis-archive-001/**"

jobs:
  hardhat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: genesis-archive-001
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Compile Solidity
        run: npm run compile
      - name: Run contract tests
        run: npm test
